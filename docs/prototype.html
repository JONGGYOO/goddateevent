<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}</style></head>
<body>
<title>갓데이트 출석부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 상단 앱 바(회원관리 / 행사관리) → 행사 상세는 ①회차 ②참여 인원 ③조 편성 ④출석체크 탭. 태블릿 가로 기준, 좁으면 한 열 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunken:#E8ECEA; --line:#D6DDDA;
  --ink:#18211E; --muted:#5E6B66;
  --accent:#2E5E4E; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4;
  --male:#2F63A3; --male-soft:#E1EAF5; --female:#B03F66; --female-soft:#F6E2E9;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --warn:#A86A12; --warn-soft:#F7EBD6; --err:#B03F3F; --err-soft:#F6E0E0;
  --plate:#FFFFFF; --plate-line:#18211E;
  --shadow:0 1px 2px rgba(20,35,30,.06),0 4px 14px rgba(20,35,30,.06);
  --f-display:"Gowun Batang",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A2320; --sunken:#0D1311; --line:#2B3833;
  --ink:#E8EEEB; --muted:#98A7A1;
  --accent:#6FB79C; --accent-ink:#0E1714; --accent-soft:#1F3A30;
  --male:#7FA9DE; --male-soft:#1C2A3B; --female:#E58BAA; --female-soft:#3A1F29;
  --ok:#5CCB92; --ok-soft:#173527; --warn:#E3A84B; --warn-soft:#3A2C14; --err:#EE8A8A; --err-soft:#3B1D1D;
  --plate:#E8EEEB; --plate-line:#0E1714; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2320; --sunken:#0D1311; --line:#2B3833;
  --ink:#E8EEEB; --muted:#98A7A1;
  --accent:#6FB79C; --accent-ink:#0E1714; --accent-soft:#1F3A30;
  --male:#7FA9DE; --male-soft:#1C2A3B; --female:#E58BAA; --female-soft:#3A1F29;
  --ok:#5CCB92; --ok-soft:#173527; --warn:#E3A84B; --warn-soft:#3A2C14; --err:#EE8A8A; --err-soft:#3B1D1D;
  --plate:#E8EEEB; --plate-line:#0E1714; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}

/* 앱 바 */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:19px;white-space:nowrap}
.mainnav{display:flex;gap:4px}
.mainnav button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--muted);min-height:42px}
.mainnav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.appbar .who{margin-left:auto;font-size:13px;color:var(--muted)}

.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.pagehead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.pagehead h1{font-family:var(--f-display);font-size:26px;margin:0;line-height:1.15;text-wrap:balance}
.pagehead .sub{display:block;color:var(--muted);font-size:13px}
.back{border:0;background:none;padding:0 0 4px;color:var(--muted);font-weight:600;font-size:14px;min-height:30px}
.spacer{flex:1}

.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--err);border:1.5px solid currentColor}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.big{min-height:52px;font-size:17px;padding:10px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:8px;font-weight:600;color:var(--muted);min-height:40px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 6px 0 14px;min-height:50px;min-width:0}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;font-size:18px;outline:none;min-width:0;padding:8px 0}
.search.big{min-height:56px}.search.big input{font-size:21px}
.clear{border:0;background:var(--sunken);border-radius:8px;width:38px;height:38px;font-size:18px;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);user-select:none;min-height:44px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
select.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:50px;padding:0 12px;font-weight:600}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;white-space:nowrap}
.pill.M{background:var(--male-soft);color:var(--male)} .pill.F{background:var(--female-soft);color:var(--female)}
.pill.ac{background:var(--accent-soft);color:var(--accent)} .pill.off{background:var(--sunken);color:var(--muted)}
.pill.w{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:2px}
.dot.M{background:var(--male)} .dot.F{background:var(--female)} .dot.car{background:var(--warn)}
.plate{display:inline-block;background:var(--plate);color:var(--plate-line);border:2px solid var(--plate-line);border-radius:6px;padding:1px 8px;font-family:var(--f-mono);font-size:14px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.plate.lg{font-size:22px;border-width:2.5px;padding:3px 12px}
.plate b{background:var(--accent-soft)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;grid-column:1/-1}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.stat .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
.stat .val{font-size:21px;font-weight:600}
.stat .val small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.stat.M .bar i{background:var(--male)} .stat.F .bar i{background:var(--female)}

/* 표 */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
.tablewrap table{min-width:820px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:700;background:var(--sunken)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td .nm{font-weight:700;font-size:16px}
.rate{display:flex;align-items:center;gap:8px}.rate .bar{width:64px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);align-items:center}

/* 행사 목록 */
.inform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:end;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:600}
.field label b,.field .lbl b{color:var(--err)}
.field>input,.field>textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:17px;min-height:50px;width:100%;min-width:0;outline:none}
.field>input:focus,.field>textarea:focus{border-color:var(--accent)}
.unit{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;min-height:50px;padding:0 12px}
.unit:focus-within{border-color:var(--accent)}
.unit input{border:0;background:transparent;outline:none;width:100%;min-width:0;padding:10px 4px;font-size:19px;text-align:right}
.unit span{font-weight:700}
.bad{border-color:var(--err)!important}
.errline{grid-column:1/-1;color:var(--err);font-size:13px;margin:0}
.list{display:flex;flex-direction:column}
.list>.it{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.list>.it.go{cursor:pointer}.list>.it.go:hover{background:var(--bg)}
.list>.it.conf{background:var(--err-soft)}
.list>.it.edit{background:var(--bg);grid-template-columns:150px minmax(0,1fr) auto}
.badge{font-family:var(--f-mono);font-weight:600;font-size:16px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 0;text-align:center;white-space:nowrap}
.badge.off{background:var(--sunken);color:var(--muted)}
.it .t1{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.it .t2{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* 행사 탭 */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:62px}
.step .s1{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.step .s2{font-weight:700;font-size:16px}
.step .s3{font-size:12px;color:var(--muted)}
.step[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.step[aria-current="true"] .s1,.step[aria-current="true"] .s3{color:inherit;opacity:.75}
.sessbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sess{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:40px;color:var(--muted)}
.sess.done{color:var(--ink)}
.sess[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 참여 인원 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pane{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px}
.pane h2{margin:0;font-size:14px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.pi{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:48px;cursor:pointer;background:var(--surface)}
.pi input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.pi .nm{font-weight:700}
.pi .ex{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.pi .ex.w{color:var(--warn);font-weight:600}.pi .ex.ok{color:var(--ok);font-weight:600}
.pi:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.roster{display:flex;flex-direction:column;gap:6px}
.roster h3{margin:6px 0 0;font-size:13px}
.roster.M h3{color:var(--male)}.roster.F h3{color:var(--female)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:4px 4px 4px 10px;font-weight:600;min-height:36px}
.rchip.M{background:var(--male-soft);color:var(--male)}.rchip.F{background:var(--female-soft);color:var(--female)}
.rchip .tg{font-family:var(--f-mono);font-size:12px;opacity:.75}
.rchip button{border:0;background:transparent;color:inherit;width:28px;height:28px;border-radius:7px;font-size:16px}
.rchip button:hover{background:var(--surface)}

/* 조 편성 */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;box-shadow:var(--shadow)}
.set{display:flex;flex-direction:column;gap:6px}
.set>.lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;width:44px;height:44px;font-size:22px;font-weight:600}
.stepper output{min-width:56px;text-align:center;font-size:20px;font-weight:600}
.settings .go{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.modehint{flex-basis:100%;font-size:13px;color:var(--muted);margin:-4px 0 0}
.score{display:flex;gap:10px;flex-wrap:wrap}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:10px;align-items:baseline}
.sc .lbl{font-size:13px;color:var(--muted);font-weight:600}
.sc .val{font-size:19px;font-weight:600}
.sc.good .val{color:var(--ok)}.sc.bad .val{color:var(--warn)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grp{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.grp.warn{border-color:var(--warn)}
.grp .hd{display:flex;align-items:center;gap:8px}
.grp .no{font-family:var(--f-display);font-size:22px}
.grp .cnt{font-size:13px;color:var(--muted)}
.grp .hd .pill{margin-left:auto}
.side{display:flex;flex-direction:column;gap:6px}
.side .sl{font-size:12px;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.side.M .sl{color:var(--male)}.side.F .sl{color:var(--female)}
.side .sl button{border:0;background:transparent;font-size:13px;font-weight:700;color:inherit;padding:4px 6px;border-radius:6px;min-height:32px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.chip{border:1.5px solid transparent;border-radius:9px;padding:5px 10px;font-weight:600;font-size:15px;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.chip.M{background:var(--male-soft);color:var(--male)}.chip.F{background:var(--female-soft);color:var(--female)}
.chip.met{border-color:var(--warn)}
.chip.met::after{content:"재회";font-size:10px;font-weight:700;color:var(--warn);background:var(--surface);border-radius:4px;padding:0 4px}
.chip.fixed{outline:2px dashed currentColor;outline-offset:-4px}
.chips .none{font-size:13px;color:var(--muted);align-self:center}
.pool{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pool h2{margin:0;font-size:13px;color:var(--muted);letter-spacing:.05em}

/* 출석 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.card{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 12px 10px;min-height:108px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .08s}
.card:active{transform:scale(.97)}
.card .g{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0}
.card.M .g{background:var(--male)}.card.F .g{background:var(--female)}
.card .name{font-size:22px;font-weight:700;line-height:1.2}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .meta .grpn{color:var(--accent);font-weight:700}
.card .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .no{font-size:13px;color:var(--muted)}
.card .st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.card.on{background:var(--ok-soft);border-color:var(--ok)}
.card.on .st{background:var(--ok);color:var(--surface)}
.card .cf{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.card .cf.y{border-color:var(--ok);color:var(--ok)}
.ckmain{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.cklog{padding:14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.cklog h2{font-size:14px;margin:0;color:var(--muted);letter-spacing:.04em}
.cklog ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:50vh;overflow:auto}
.cklog li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.cklog li:last-child{border-bottom:0}
.cklog .dv{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--sunken);color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.pcard.on{background:var(--ok-soft);border-color:var(--ok)}
.pcard .ow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet.wide{width:min(900px,100%)}
.sheet h3{margin:0;font-size:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .sec{display:flex;flex-direction:column;gap:10px}
.sheet .sec h4{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-weight:700}
.gender button[aria-pressed="true"].M{border-color:var(--male);background:var(--male-soft);color:var(--male)}
.gender button[aria-pressed="true"].F{border-color:var(--female);background:var(--female-soft);color:var(--female)}
.plateIn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.plateIn.add{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto}
.plateIn input{text-align:center;font-family:var(--f-mono);font-size:21px;font-weight:600;letter-spacing:.06em;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;min-height:52px;min-width:0;width:100%;outline:none}
.plateIn input:focus{border-color:var(--accent)}
.carbox{display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.carbox .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.carbox .ttl{font-size:13px;color:var(--muted);font-weight:700}
.toggle{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;min-height:52px}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.gbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:56px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.gbtns button small{font-size:11px;font-weight:600;color:var(--muted)}
.gbtns button small.w{color:var(--warn)}
.gbtns button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.actions .l{margin-right:auto}
.notice{background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.notice.err{background:var(--err-soft)}
.notice p{margin:0;font-weight:600}
.errmsg{color:var(--err);font-size:13px;margin:0}
.carlist{display:flex;flex-direction:column;gap:6px}
.carlist .ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:10px}
.histl{display:flex;flex-direction:column;gap:6px}
.histl .h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px}
.wks{display:flex;gap:4px}.wks i{width:18px;height:18px;border-radius:4px;background:var(--sunken);display:inline-block}.wks i.y{background:var(--accent)}
.prev{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:320px}
.prev table{min-width:600px}.prev td,.prev th{padding:8px 10px;font-size:14px}
.cols{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--muted)}
.cols code{font-family:var(--f-mono);color:var(--ink)}
textarea.paste{font-family:var(--f-mono);font-size:13px;min-height:140px;resize:vertical}
.mk{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.mk.y{background:var(--accent);color:var(--accent-ink)}.mk.n{background:var(--err-soft);color:var(--err)}.mk.f{background:var(--sunken);color:var(--muted)}
.marks{display:flex;gap:4px}
th.c,td.c{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-weight:500;min-height:48px}
.toast button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:9px;padding:6px 14px;font-weight:700;min-height:38px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}

@media (max-width:980px){.ckmain,.two{grid-template-columns:minmax(0,1fr)}.cklog{position:static}}
@media (max-width:700px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}.settings .go{margin-left:0;width:100%}.settings .go .btn{flex:1}
  .inform,.list>.it.edit{grid-template-columns:110px minmax(0,1fr)}.inform .btn,.list>.it.edit .acts{grid-column:1/-1}

<script>
(function(){
/* ================= 공통 ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=ymd(new Date());
const WD="일월화수목금토";
const fmtS=s=>{const d=new Date(s+"T00:00");return `${d.getMonth()+1}.${d.getDate()}(${WD[d.getDay()]})`};
const fmtD=t=>{const d=new Date(t);return d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const choOf=c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c};
function matchAt(name,q){for(let s=0;s+q.length<=name.length;s++){let ok=true;for(let j=0;j<q.length;j++){const n=name[s+j],c=q[j];if(CHO.includes(c)?choOf(n)!==c:n!==c){ok=false;break}}if(ok)return s}return -1}
const hl=(name,h,len)=>h<0?esc(name):esc(name.slice(0,h))+"<mark>"+esc(name.slice(h,h+len))+"</mark>"+esc(name.slice(h+len));
const GN=g=>g==="M"?"형제":"자매";
const FRONT_RE=/^\d{2,3}[가-힣]$/,BACK_RE=/^\d{4}$/;
function normPhone(s){const d=String(s||"").replace(/\D/g,"");return /^010\d{8}$/.test(d)?d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7):null}
function normPlate(s){const m=String(s||"").replace(/\s/g,"").match(/^(\d{2,3}[가-힣])(\d{4})$/);return m?m[1]+" "+m[2]:null}

let toastT;
function toast(msg,undo){const t=$("toast");t.innerHTML=`<span>${msg}</span>`+(undo?'<button type="button" id="undoBtn">되돌리기</button>':"");t.hidden=false;
  if(undo)$("undoBtn").onclick=()=>{undo();t.hidden=true};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,undo?5000:2600)}
function openSheet(html,wide){$("sheet").className="sheet"+(wide?" wide":"");$("sheet").innerHTML=html;$("scrim").hidden=false}
function closeSheet(){$("scrim").hidden=true}
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

/* ================= 데이터 ================= */
/* S.members [{id,name,g,phone,church,cars[],memo,created}]
   S.events [{id,no,name,created}]   S.sessions [{id,eventId,date}]  (회차 번호는 날짜 순서)
   S.parts {eventId:{memberId:명찰번호}}   S.groups {sessionId:{k,assign:{memberId:조}}}
   S.att {sessionId:{memberId:{at,dev}}}   S.cars {sessionId:{memberId:{plate,at,dev}}}   S.log {sessionId:[{t,mid,kind,dev}]} */
const KEY="goddate-app-test-v1";
let S;
let seq=1;const uid=p=>p+(Date.now().toString(36))+(seq++);
const MB=()=>Object.fromEntries(S.members.map(m=>[m.id,m]));
let BY={};
function reindex(){BY=MB()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const sessionsOf=eid=>S.sessions.filter(s=>s.eventId===eid).sort((a,b)=>a.date.localeCompare(b.date)).map((s,i)=>({...s,no:i+1}));
const sessById=sid=>{const s=S.sessions.find(x=>x.id===sid);if(!s)return null;return sessionsOf(s.eventId).find(x=>x.id===sid)};
const partsOf=eid=>S.parts[eid]||(S.parts[eid]={});
const partIds=eid=>Object.keys(partsOf(eid)).filter(id=>BY[id]);
const evById=eid=>S.events.find(e=>e.id===eid);

/* ================= 조 편성 알고리즘 ================= */
const pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
function buildMet(assigns){const met={};assigns.forEach(({no,assign})=>{const gs={};Object.entries(assign).forEach(([id,g])=>{if(g!=null)(gs[g]=gs[g]||[]).push(id)});
  Object.values(gs).forEach(m=>{for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++)(met[pk(m[i],m[j])]=met[pk(m[i],m[j])]||[]).push(no)})});return met}
function groupsOf(assign,ids,k){const g=Array.from({length:k},()=>[]);ids.forEach(id=>{const x=assign[id];if(x!=null&&x<k)g[x].push(id)});return g}
function hungarian(C){const n=C.length,INF=1e18,u=Array(n+1).fill(0),v=Array(n+1).fill(0),p=Array(n+1).fill(0),way=Array(n+1).fill(0);
  for(let i=1;i<=n;i++){p[0]=i;let j0=0;const minv=Array(n+1).fill(INF),used=Array(n+1).fill(false);
    do{used[j0]=true;const i0=p[j0];let d=INF,j1=0;for(let j=1;j<=n;j++)if(!used[j]){const cur=C[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0}if(minv[j]<d){d=minv[j];j1=j}}
      for(let j=0;j<=n;j++){if(used[j]){u[p[j]]+=d;v[j]-=d}else minv[j]-=d}j0=j1}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}
  const r=Array(n);for(let j=1;j<=n;j++)if(p[j])r[p[j]-1]=j-1;return r}
function solveGroups(ids,k,met,mode,base,avoid){
  const G=id=>BY[id].g;
  const W=(a,b)=>{const m=met[pk(a,b)];return m?(G(a)!==G(b)?10:1)*m.length:0};
  const randG=mode==="all"?["M","F"]:mode==="fixM"?["F"]:["M"];
  const fixG=mode==="fixM"?"M":mode==="fixF"?"F":null;
  const a={};ids.forEach(id=>{const x=base[id];a[id]=(x!=null&&x<k&&!randG.includes(G(id)))?x:null});
  if(fixG){const cnt=Array(k).fill(0);ids.forEach(id=>{if(G(id)===fixG&&a[id]!=null)cnt[a[id]]++});
    shuffle(ids.filter(id=>G(id)===fixG&&a[id]==null)).forEach(id=>{const mn=Math.min(...cnt);const c=shuffle(cnt.map((v,i)=>v===mn?i:-1).filter(i=>i>=0))[0];a[id]=c;cnt[c]++})}
  const slots={};
  randG.forEach((g,gi)=>{const n=ids.filter(id=>G(id)===g).length,base_=Math.floor(n/k),extra=n%k;
    const other=Array(k).fill(0);ids.forEach(id=>{if(G(id)!==g&&a[id]!=null)other[a[id]]++});
    let order=[...Array(k).keys()];order=fixG?shuffle(order).sort((x,y)=>other[x]-other[y]):(gi===0?order:order.reverse());
    const sz=Array(k).fill(base_);order.slice(0,extra).forEach(i=>sz[i]++);slots[g]=sz});
  const R=ids.filter(id=>randG.includes(G(id)));
  const fill=()=>{const b={...a};randG.forEach(g=>{const r=shuffle(R.filter(id=>G(id)===g));let i=0;slots[g].forEach((s,gi)=>{for(let t=0;t<s;t++)b[r[i++]]=gi})});return b};
  if(!avoid)return fill();
  const cost=b=>{let c=0;groupsOf(b,ids,k).forEach(m=>{for(let i=0;i<m.length;i++)for(let j=i+1;j<m.length;j++)c+=W(m[i],m[j])});return c};
  const reassign=(b,g)=>{const rs=R.filter(id=>G(id)===g);if(!rs.length)return;const slotG=[];slots[g].forEach((sz,gi)=>{for(let t=0;t<sz;t++)slotG.push(gi)});
    const gm=groupsOf(b,ids,k);const C=rs.map(id=>slotG.map(gi=>gm[gi].reduce((s,y)=>G(y)!==g?s+W(id,y):s,0)+Math.random()*0.01));
    const asg=hungarian(C);rs.forEach((id,i)=>b[id]=slotG[asg[i]])};
  let best=null,bestC=Infinity;
  for(let r=0;r<20&&bestC>0;r++){
    const b=fill();for(let it=0;it<(randG.length>1?8:1);it++)shuffle([...randG]).forEach(g=>reassign(b,g));
    const gm=groupsOf(b,ids,k);const c=(x,g,ex)=>gm[g].reduce((s,y)=>y===x||y===ex?s:s+W(x,y),0);
    let imp=true,pass=0;
    while(imp&&pass++<40){imp=false;const o=shuffle([...R]);
      for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++){const x=o[i],y=o[j];if(G(x)!==G(y))continue;const gx=b[x],gy=b[y];if(gx===gy)continue;
        const d=c(x,gy,y)+c(y,gx,x)-c(x,gx,x)-c(y,gy,y);if(d<0){b[x]=gy;b[y]=gx;gm[gx].splice(gm[gx].indexOf(x),1,y);gm[gy].splice(gm[gy].indexOf(y),1,x);imp=true}}}
    const cc=cost(b);if(cc<bestC){bestC=cc;best=b}}
  return best;
}
function priorAssigns(sid){const s=sessById(sid);return sessionsOf(s.eventId).filter(x=>x.no<s.no&&S.groups[x.id]).map(x=>({no:x.no,assign:S.groups[x.id].assign}))}

/* ================= 예시 데이터 ================= */
function seed(){
  let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;const ri=n=>Math.floor(rnd()*n);
  const MN=["김민수","김민수","이준호","박성진","최영훈","정우성","강다니엘","조현우","윤재석","장태민","임하늘","한승우","오세진","서지훈","신동혁","권요셉","황바울","안성민","송현석","전다윗","홍길준","유상현","고민석","문태양","배진우","노한결","하은찬","남궁현"];
  const FN=["김지은","이은혜","박소망","최하은","정예린","강수아","조은비","윤서연","장미래","임사랑","한지혜","오유진","서은총","신예은","권한나","황다은","안소희","송민지","전기쁨","홍주희","유나래","고은솔","문가은","배수정","김지은","백시온","주예나"];
  const CH=["은혜교회","새소망교회","빛과소금교회","주님의교회","한빛교회","생명샘교회","새생명교회",""];
  const CARS=["12가 3456","45나 7812","123다 4567","67라 9021","301마 2244","88바 1357","27사 8640","19아 5072","154자 3318","62하 7790","33허 2048","210거 6601","71너 9135","56더 4482","142러 1209","90머 7356","38버 2913","245서 5508","14어 8174","77저 3662","109고 4920","52노 1846","81도 6235","166로 9472","23모 3015","44보 7781","199소 2369","68오 5154","31구 8806"];
  S={members:[],events:[],sessions:[],parts:{},groups:{},att:{},cars:{},log:{}};
  let ci=0;
  const mk=(n,g,i)=>{const cars=[];if(ri(10)<6&&ci<CARS.length)cars.push(CARS[ci++]);
    S.members.push({id:"m"+g+i,name:n,g,phone:ri(10)<8?"010-"+(2000+ri(7999))+"-"+pad(ri(100))+pad(ri(100)):"",church:CH[ri(CH.length)],cars,memo:"",created:new Date(2026,ri(3),1+ri(27)).getTime()})};
  MN.forEach((n,i)=>mk(n,"M",i));FN.forEach((n,i)=>mk(n,"F",i));
  reindex();
  const M=S.members.filter(m=>m.g==="M").map(m=>m.id),F=S.members.filter(m=>m.g==="F").map(m=>m.id);
  const ev=(no,name,dates,mi,fi,month)=>{const e={id:"e"+no,no,name,created:new Date(2026,month,1).getTime()};S.events.push(e);
    const p=S.parts[e.id]={};mi.forEach((id,i)=>p[id]=i+1);fi.forEach((id,i)=>p[id]=101+i);
    dates.forEach((d,i)=>S.sessions.push({id:e.id+"s"+(i+1),eventId:e.id,date:d}));return e};
  ev(1,"봄 갓데이트",["2026-03-08","2026-03-15","2026-03-22"],M.filter((_,i)=>i%2===0).slice(0,12),F.filter((_,i)=>i%2===1).slice(0,12),2);
  ev(2,"여름 갓데이트",["2026-06-07","2026-06-14","2026-06-21","2026-06-28"],M.slice(6,26),F.slice(4,24),5);
  ev(3,"가을 갓데이트",["2026-10-18","2026-10-25","2026-11-01","2026-11-08","2026-11-15"],M.slice(0,25),F.slice(0,25),9);
  // 지난 회차: 조 편성 + 출석 + 차량
  S.events.forEach(e=>{const ids=partIds(e.id),k=ids.length>=40?5:4;
    sessionsOf(e.id).forEach(s=>{
      const past=s.date<TODAY;
      if(past||s.no===4){S.groups[s.id]={k,assign:solveGroups(ids,k,buildMet(priorAssigns(s.id)),"all",{},true)}}
      if(!past)return;
      const at=S.att[s.id]={},cr=S.cars[s.id]={},lg=S.log[s.id]=[];const base=new Date(s.date+"T13:20").getTime();
      ids.forEach(id=>{if(ri(100)<88){const t=base+ri(45)*60000;at[id]={at:t,dev:ri(2)?"A":"B"};lg.push({t,mid:id,kind:"in",dev:at[id].dev});
        const m=BY[id];if(m.cars.length&&ri(10)<8){cr[id]={plate:m.cars[0],at:t-ri(5)*60000,dev:"A"};lg.push({t:cr[id].at,mid:id,kind:"car",dev:"A"})}}});
      lg.sort((a,b)=>b.t-a.t)});
  });
}
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!S.members)seed();
reindex();

/* ================= 화면 상태 ================= */
const U={view:"events",eid:null,tab:"sessions",sid:null,
  mG:"ALL",mSort:"name",mDir:1,dev:"A",ckMode:"people",ckG:"ALL",grMode:"all",pG:"ALL",evEdit:null,evDel:null,sDel:null};
try{U.dev=localStorage.getItem(KEY+"-dev")||"A"}catch(e){}

function render(){
  document.querySelectorAll(".mainnav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===(U.view==="event"?"events":U.view)));
  if(U.view==="members")vMembers();else if(U.view==="events")vEvents();else if(U.view==="stats")vStats();else vEvent();
  save();

  let rows=M.map(m=>{if(!q)return{m,h:-1};const h=matchAt(m.name,q);if(h>=0)return{m,h};const dq=q.replace(/\D/g,"");

}

function bindPlate(onEnter){$("pFront").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("pBack").focus()}});
  $("pBack").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,4)});

function readPlate(required,exceptId){const f=$("pFront").value.replace(/\s/g,""),b=$("pBack").value.replace(/\s/g,"");
  if(!f&&!b)return required?{error:"차량번호를 입력하세요. 예: 19저 2074"}:{plate:null};

  if(o)return{error:`이미 ${o.name}님 차량으로 등록된 번호예요.`};return{plate}}

const SAMPLE="이름\t성별\t휴대폰\t교회\t차량번호\n도하람\t여\t010-3344-1290\t한빛교회\t52가 1188\n변승리\t남\t01077120934\t새소망교회\t\n주예진\t여\t\t\t\n탁요한\t남\t010-7712-0934\t은혜교회\t\n성다솜\t\t010-2210-6543\t생명샘교회\t\n이사무엘\t남\t\t은혜교회\t19저20";
function parseRows(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(!lines.length)return[];
  const sep=lines[0].includes("\t")?"\t":",";let rows=lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,"")));
  if(/이름/.test(rows[0][0]))rows=rows.slice(1);const seen=new Set();
  return rows.map(r=>{const[name,g,p,church,car]=r;const errs=[];
    const gg=/^(남|M|m|형제|남자)$/.test(g||"")?"M":/^(여|F|f|자매|여자)$/.test(g||"")?"F":null;
    if(!name)errs.push("이름 없음");if(!gg)errs.push("성별은 남/여");
    const ph=p?normPhone(p):"";if(p&&!ph)errs.push("휴대폰 형식");
    let plate=null;if(car){plate=normPlate(car);if(!plate)errs.push("차량번호 형식");else if(S.members.some(m=>m.cars.includes(plate)))errs.push("차량 중복")}
    let status=errs.length?"bad":"ok";if(status==="ok"&&ph&&(S.members.some(m=>m.phone===ph)||seen.has(ph))){status="dup";errs.push("같은 번호 회원 있음")}if(ph)seen.add(ph);
    return{name,g:gg,phone:ph||p||"",church:church||"",plate,raw:r,status,errs}});
}
function importer(){
  let text="",rows=[];
  const draw=()=>{const ok=rows.filter(r=>r.status==="ok").length;
    openSheet(`<h3>엑셀로 일괄 등록</h3>
      <div class="cols">엑셀에서 아래 순서의 열을 복사해 붙여넣거나 CSV 파일을 고르세요.<br><code>이름* · 성별*(남/여) · 휴대폰 · 교회 · 차량번호</code> (* 필수)</div>
      <div class="field"><label for="imText">붙여넣기</label><textarea id="imText" class="paste" placeholder="여기에 붙여넣기">${esc(text)}</textarea></div>
      <div class="actions" style="justify-content:flex-start"><label class="btn ghost sm" for="imFile">CSV 파일 선택</label><input type="file" id="imFile" accept=".csv,.tsv,.txt" hidden><button class="btn ghost sm" id="imSample" type="button">예시 데이터 넣기</button></div>
      ${rows.length?`<div class="sec"><h4>미리보기 · 등록 가능 ${ok}명 / ${rows.length}행</h4><div class="prev"><table><thead><tr><th>상태</th><th>이름</th><th>성별</th><th>휴대폰</th><th>교회</th><th>차량</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td><span class="pill ${r.status==="ok"?"ok":r.status==="dup"?"w":"F"}">${r.status==="ok"?"등록":r.status==="dup"?"건너뜀":"오류"}</span> <span class="hint">${r.errs.join(", ")}</span></td><td><strong>${esc(r.name)}</strong></td><td>${r.g?`<span class="pill ${r.g}">${r.g==="M"?"남":"여"}</span>`:esc(r.raw[1])}</td><td class="num">${esc(r.phone)}</td><td>${esc(r.church)}</td><td>${r.plate?`<span class="plate">${esc(r.plate)}</span>`:esc(r.raw[4]||"")}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
      <div class="actions"><button class="btn ghost" id="imCancel" type="button">취소</button><button class="btn" id="imGo" type="button" ${ok?"":"disabled"}>${ok}명 등록</button></div>`,true);
    const upd=()=>{text=$("imText").value;rows=parseRows(text);draw()};
    $("imText").addEventListener("paste",()=>setTimeout(upd,0));$("imText").addEventListener("change",upd);
    $("imSample").onclick=()=>{text=SAMPLE;rows=parseRows(text);draw()};
    $("imFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{text=String(fr.result);rows=parseRows(text);draw()};fr.readAsText(f,"utf-8")};
    $("imCancel").onclick=closeSheet;
    $("imGo").onclick=()=>{const add=rows.filter(r=>r.status==="ok");add.forEach(r=>S.members.push({id:uid("m"),name:r.name,g:r.g,phone:r.phone,church:r.church,cars:r.plate?[r.plate]:[],memo:"",created:Date.now()}));
      reindex();closeSheet();render();toast(`${add.length}명을 등록했어요`)};
  };draw();
}

function evValidate(no,name,except){if(!/^\d{1,3}$/.test(no)||+no<1)return{f:"no",m:"회차는 1 이상의 숫자로 입력하세요."};
  const o=S.events.find(e=>e.no===+no&&e.id!==except);if(o)return{f:"no",m:`제${no}회는 이미 ‘${o.name}’로 등록돼 있어요.`};
  if(!name.trim())return{f:"name",m:"행사 이름을 입력하세요."};return null}
function rEvents(){
  const ev=[...S.events].sort((a,b)=>b.no-a.no);
  $("evList").innerHTML=ev.length?ev.map(e=>{
    const ss=sessionsOf(e.id),ids=partIds(e.id),m=ids.filter(id=>BY[id].g==="M").length;
    const done=ss.filter(s=>s.date<TODAY).length,nextS=ss.find(s=>s.date>=TODAY);
    if(U.evEdit===e.id)return `<div class="it edit"><div class="field"><label for="eNo">회차</label><div class="unit"><span>제</span><input id="eNo" inputmode="numeric" maxlength="3" value="${e.no}"><span>회</span></div></div>
      <div class="field"><label for="eName">행사 이름</label><input id="eName" maxlength="40" value="${esc(e.name)}"></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-act="evCancel">취소</button><button class="btn sm" type="button" data-act="evSave" data-id="${e.id}">저장</button></div><p class="errline" id="eErr" hidden></p></div>`;
    if(U.evDel===e.id)return `<div class="it conf"><span class="badge">제${e.no}회</span><div><div class="t1">‘${esc(e.name)}’을 삭제할까요?</div><div class="t2">회차 ${ss.length}개와 참여 인원, 조 편성, 출석 기록이 함께 지워집니다.</div></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-act="evDelNo">아니요</button><button class="btn danger sm" type="button" data-act="evDelYes" data-id="${e.id}">삭제</button></div></div>`;
    return `<div class="it go" data-act="evOpen" data-id="${e.id}"><span class="badge ${nextS?"":"off"}">제${e.no}회</span>
      <div><div class="t1">${esc(e.name)}</div><div class="t2"><span>회차 ${ss.length}개${ss.length?` · ${fmtS(ss[0].date)} ~ ${fmtS(ss[ss.length-1].date)}`:""}</span><span>참여 남 ${m} · 여 ${ids.length-m}</span><span>${!ss.length?"회차 없음":nextS?`다음: ${nextS.no}회차 ${fmtS(nextS.date)}`:`종료 · ${done}회 진행`}</span></div></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-act="evEdit" data-id="${e.id}">수정</button><button class="btn ghost sm" type="button" data-act="evDel" data-id="${e.id}">삭제</button><button class="btn sm" type="button" data-act="evOpen" data-id="${e.id}">열기</button></div></div>`;
  }).join(""):`<div class="empty" style="border:0">아직 등록된 행사가 없어요. 위에서 첫 행사를 등록하세요.</div>`;
}
ACT.evOpen=(b,e)=>{if(e.target.closest('[data-act="evEdit"],[data-act="evDel"]'))return;U.eid=b.dataset.id;U.view="event";U.tab="sessions";U.sid=null;window.scrollTo(0,0);render()};
ACT.evEdit=(b,e)=>{e.stopPropagation();U.evEdit=b.dataset.id;U.evDel=null;rEvents();$("eName").focus()};
ACT.evCancel=()=>{U.evEdit=null;rEvents()};
ACT.evSave=b=>{const ev=evById(b.dataset.id),no=$("eNo").value,name=$("eName").value.trim(),v=evValidate(no,name,ev.id);
  if(v){$("eErr").textContent=v.m;$("eErr").hidden=false;return}ev.no=+no;ev.name=name;U.evEdit=null;render();toast("저장했어요")};
ACT.evDel=(b,e)=>{e.stopPropagation();U.evDel=b.dataset.id;U.evEdit=null;rEvents()};
ACT.evDelNo=()=>{U.evDel=null;rEvents()};
ACT.evDelYes=b=>{const id=b.dataset.id,ev=evById(id);sessionsOf(id).forEach(s=>{delete S.groups[s.id];delete S.att[s.id];delete S.cars[s.id];delete S.log[s.id]});
  S.sessions=S.sessions.filter(s=>s.eventId!==id);delete S.parts[id];S.events=S.events.filter(e=>e.id!==id);U.evDel=null;render();toast(`제${ev.no}회 ${esc(ev.name)}를 삭제했어요`)};

/* ================= 행사 상세 ================= */
function defaultSid(){const ss=sessionsOf(U.eid);if(!ss.length)return null;if(U.sid&&ss.some(s=>s.id===U.sid))return U.sid;return (ss.find(s=>s.date>=TODAY)||ss[ss.length-1]).id}
function vEvent(){
  const e=evById(U.eid);if(!e){U.view="events";return render()}
  U.sid=defaultSid();
  const ss=sessionsOf(e.id),ids=partIds(e.id),m=ids.filter(id=>BY[id].g==="M").length;
  const cur=U.sid?sessById(U.sid):null;
  const steps=[["sessions","1","회차 관리",`${ss.length}개 회차`],["people","2","참여 인원",`남 ${m} · 여 ${ids.length-m}`],
    ["groups","3","조 편성",cur?`${cur.no}회차 ${S.groups[cur.id]?S.groups[cur.id].k+"개 조":"미편성"}`:"회차 필요"],
    ["check","4","출석체크",cur?`${cur.no}회차 ${Object.keys(S.att[cur.id]||{}).filter(id=>partsOf(e.id)[id]!=null).length}/${ids.length}명`:"회차 필요"]];
  $("view").innerHTML=`
  <div class="pagehead"><div><button class="back" type="button" data-act="nav" data-v="events">← 행사 목록</button><h1>제${e.no}회 ${esc(e.name)}</h1></div></div>
  <nav class="steps" aria-label="행사 진행 단계">${steps.map(([t,n,a,b])=>`<button type="button" class="step" data-act="tab" data-t="${t}" aria-current="${U.tab===t}"><span class="s1">${n}단계</span><span class="s2">${a}</span><span class="s3">${b}</span></button>`).join("")}</nav>
  <div id="tabBody" style="display:flex;flex-direction:column;gap:14px"></div>`;
  ({sessions:tSessions,people:tPeople,groups:tGroups,check:tCheck})[U.tab]();
}
ACT.tab=b=>{U.tab=b.dataset.t;render()};
ACT.pickS=b=>{U.sid=b.dataset.sid;render()};
function sessBar(){const ss=sessionsOf(U.eid);
  return `<div class="sessbar"><span class="hint" style="margin-right:4px">회차</span>${ss.map(s=>`<button type="button" class="sess ${s.date<TODAY?"done":""}" data-act="pickS" data-sid="${s.id}" aria-current="${s.id===U.sid}">${s.no}회차 · ${fmtS(s.date)}${s.date===TODAY?" · 오늘":""}</button>`).join("")}</div>`}
function needs(){const ss=sessionsOf(U.eid),ids=partIds(U.eid);
  if(!ss.length)return `<div class="empty"><strong>회차가 없어요</strong><span class="hint">1단계에서 회차(날짜)를 먼저 추가하세요.</span><button class="btn" type="button" data-act="tab" data-t="sessions">회차 추가하러 가기</button></div>`;
  if(!ids.length)return `<div class="empty"><strong>참여 인원이 없어요</strong><span class="hint">2단계에서 회원 명부에서 참여자를 골라 확정하세요.</span><button class="btn" type="button" data-act="tab" data-t="people">참여 인원 정하러 가기</button></div>`;
  return null}

/* ---------- ① 회차 관리 ---------- */
function tSessions(){
  const ss=sessionsOf(U.eid),ids=partIds(U.eid);
  const last=ss.length?new Date(ss[ss.length-1].date+"T00:00"):null;const def=last?ymd(new Date(last.getTime()+7*864e5)):TODAY;
  $("tabBody").innerHTML=`
  <form class="inform" id="sForm" novalidate style="grid-template-columns:minmax(0,260px) minmax(0,1fr) auto">
    <div class="field"><label for="sDate">회차 날짜 <b>*</b></label><input id="sDate" type="date" value="${def}"></div>
    <p class="hint" style="margin:0 0 14px">회차 번호는 날짜 순서로 자동으로 매겨집니다. 보통 매주 같은 요일이라 마지막 회차의 일주일 뒤가 기본값이에요.</p>
    <button class="btn" type="submit">회차 추가</button><p class="errline" id="sErr" hidden></p>
  </form>
  <div class="box list">${ss.length?ss.map(s=>{
    const att=Object.keys(S.att[s.id]||{}).filter(id=>partsOf(U.eid)[id]!=null).length,gr=S.groups[s.id];
    const st=s.date<TODAY?'<span class="pill off">지난 회차</span>':s.date===TODAY?'<span class="pill ok">오늘</span>':'<span class="pill ac">예정</span>';
    if(U.sDel===s.id)return `<div class="it conf"><span class="badge">${s.no}회차</span><div><div class="t1">${fmtS(s.date)} 회차를 삭제할까요?</div><div class="t2">이 회차의 조 편성과 출석 기록 ${att}건이 함께 지워지고, 뒤 회차 번호가 앞당겨집니다.</div></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-act="sDelNo">아니요</button><button class="btn danger sm" type="button" data-act="sDelYes" data-sid="${s.id}">삭제</button></div></div>`;
    return `<div class="it"><span class="badge ${s.date<TODAY?"off":""}">${s.no}회차</span>
      <div><div class="t1">${fmtS(s.date)} ${st}</div><div class="t2"><span>출석 ${att}/${ids.length}명</span><span>${gr?`조 편성 ${gr.k}개 조`:"조 미편성"}</span><span>차량 ${Object.keys(S.cars[s.id]||{}).length}대</span></div></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-act="sDate" data-sid="${s.id}">날짜 변경</button><button class="btn ghost sm" type="button" data-act="sDel" data-sid="${s.id}">삭제</button><button class="btn ghost sm" type="button" data-act="goS" data-t="groups" data-sid="${s.id}">조 편성</button><button class="btn sm" type="button" data-act="goS" data-t="check" data-sid="${s.id}">출석체크</button></div></div>`}).join("")
    :`<div class="empty" style="border:0"><strong>아직 회차가 없어요</strong><span class="hint">위에서 첫 회차 날짜를 추가하세요. 1~5회 정도 진행하는 행사라면 5번 추가하면 됩니다.</span></div>`}</div>`;
  $("sForm").addEventListener("submit",e=>{e.preventDefault();const d=$("sDate").value;
    if(!d){$("sErr").textContent="날짜를 고르세요.";$("sErr").hidden=false;return}
    if(ss.some(s=>s.date===d)){$("sErr").textContent=`${fmtS(d)}에는 이미 회차가 있어요.`;$("sErr").hidden=false;return}
    const id=uid("s");S.sessions.push({id,eventId:U.eid,date:d});render();toast(`${sessById(id).no}회차 ${fmtS(d)}를 추가했어요`)});
}
ACT.goS=b=>{U.sid=b.dataset.sid;U.tab=b.dataset.t;window.scrollTo(0,0);render()};
ACT.sDel=b=>{U.sDel=b.dataset.sid;tSessions()};ACT.sDelNo=()=>{U.sDel=null;tSessions()};
ACT.sDelYes=b=>{const id=b.dataset.sid;S.sessions=S.sessions.filter(s=>s.id!==id);delete S.groups[id];delete S.att[id];delete S.cars[id];delete S.log[id];if(U.sid===id)U.sid=null;U.sDel=null;render();toast("회차를 삭제했어요")};
ACT.sDate=b=>{const s=sessById(b.dataset.sid);
  openSheet(`<h3>${s.no}회차 날짜 변경</h3><div class="field"><label for="nd">날짜</label><input id="nd" type="date" value="${s.date}"></div><p class="errmsg" id="ndErr" hidden></p>
    <div class="actions"><button class="btn ghost" type="button" id="c">취소</button><button class="btn" type="button" id="o">저장</button></div>`);
  $("c").onclick=closeSheet;$("o").onclick=()=>{const d=$("nd").value;if(!d)return;if(sessionsOf(U.eid).some(x=>x.date===d&&x.id!==s.id)){$("ndErr").textContent="그날에는 이미 회차가 있어요.";$("ndErr").hidden=false;return}
    S.sessions.find(x=>x.id===s.id).date=d;closeSheet();render();toast("날짜를 바꿨어요. 회차 번호는 날짜 순서로 다시 매겨집니다.")}};

/* ---------- ② 참여 인원 ---------- */
function tPeople(){
  $("tabBody").innerHTML=`
  <p class="hint" style="margin:0">회원 명부에서 이 행사에 참여할 사람을 골라 확정합니다. 확정한 인원만 조 편성과 출석체크 명단에 나옵니다. 명찰 번호는 남자 1번부터, 여자 101번부터 자동으로 붙어요.</p>
  <div class="two">
    <section class="box pane"><h2>회원 명부에서 선택</h2>
      <div class="controls"><div class="seg">${["ALL","M","F"].map(g=>`<button type="button" data-act="pG" data-g="${g}" aria-pressed="${U.pG===g}">${g==="ALL"?"전체":g==="M"?"남":"여"}</button>`).join("")}</div>
        <label class="search" for="pq"><input id="pq" type="search" autocomplete="off" placeholder="이름·초성 검색"><button class="clear" type="button" data-act="clr" data-for="pq" aria-label="지우기">×</button></label></div>
      <div class="controls"><button class="btn ghost sm" type="button" data-act="pAll">보이는 사람 모두 선택</button><span class="spacer"></span><button class="btn" type="button" data-act="pAdd" id="pAddBtn">선택한 0명 참여 확정</button></div>
      <div class="plist" id="pList"></div>
    </section>
    <section class="box pane" id="pRoster"></section>
  </div>`;
  rPeople();
}
function rPeople(){
  const P=partsOf(U.eid),q=($("pq")?.value||"").replace(/\s+/g,"");
  const cand=S.members.filter(m=>P[m.id]==null&&(U.pG==="ALL"||m.g===U.pG)).map(m=>({m,h:q?matchAt(m.name,q):-1})).filter(x=>!q||x.h>=0).sort((a,b)=>a.m.g===b.m.g?a.m.name.localeCompare(b.m.name,"ko"):a.m.g==="M"?-1:1);
  const dup={};S.members.forEach(m=>dup[m.name]=(dup[m.name]||0)+1);
  $("pList").innerHTML=cand.length?cand.map(({m,h})=>{const hs=memberHist(m.id);
    return `<label class="pi"><input type="checkbox" value="${m.id}" data-pc="1"><span class="dot ${m.g}"></span><span class="nm">${hl(m.name,h,q.length)}</span>${dup[m.name]>1?`<span class="hint num">${m.phone?m.phone.slice(-4):esc(m.church)}</span>`:""}
      <span class="ex ${hs.length?"":"ok"}">${hs.length?hs.map(x=>`제${x.e.no}회`).join(" · "):"첫 참여"}</span></label>`}).join("")
    :`<div class="empty" style="border:0"><span class="hint">${q?"검색 결과가 없어요.":"선택할 회원이 없어요. 모두 참여 중이거나 명부가 비어 있습니다."}</span></div>`;
  updAddBtn();
  const ids=partIds(U.eid);const byG=g=>ids.filter(id=>BY[id].g===g).sort((a,b)=>P[a]-P[b]);
  const M=byG("M"),F=byG("F");
  $("pRoster").innerHTML=`<h2>참여 확정 인원 <span class="pill M">남 ${M.length}</span><span class="pill F">여 ${F.length}</span>${M.length!==F.length&&ids.length?`<span class="pill w">남녀 ${Math.abs(M.length-F.length)}명 차이</span>`:""}</h2>
    ${ids.length?["M","F"].map(g=>{const L=g==="M"?M:F;return `<div class="roster ${g}"><h3>${GN(g)} ${L.length}명</h3><div class="rchips">${L.map(id=>`<span class="rchip ${g}"><span class="tg">${P[id]}</span>${esc(BY[id].name)}<button type="button" data-act="pRm" data-id="${id}" aria-label="${esc(BY[id].name)} 빼기">×</button></span>`).join("")||'<span class="hint">아직 없음</span>'}</div></div>`}).join("")
    :`<div class="empty" style="border:0"><span class="hint">왼쪽에서 참여자를 골라 확정하세요.</span></div>`}`;
}
function updAddBtn(){const n=document.querySelectorAll('[data-pc]:checked').length;const b=$("pAddBtn");if(b){b.textContent=`선택한 ${n}명 참여 확정`;b.disabled=!n}}
document.addEventListener("change",e=>{if(e.target.matches("[data-pc]"))updAddBtn()});
INP.pq=()=>rPeople();
ACT.pG=b=>{U.pG=b.dataset.g;document.querySelectorAll('[data-act="pG"]').forEach(x=>x.setAttribute("aria-pressed",x===b));rPeople()};
ACT.pAll=()=>{document.querySelectorAll("[data-pc]").forEach(c=>c.checked=true);updAddBtn()};
function nextTag(g){const P=partsOf(U.eid);const used=new Set(Object.entries(P).filter(([id])=>BY[id]&&BY[id].g===g).map(([,t])=>t));let t=g==="M"?1:101;while(used.has(t))t++;return t}
ACT.pAdd=()=>{const ids=[...document.querySelectorAll("[data-pc]:checked")].map(c=>c.value);const P=partsOf(U.eid);ids.forEach(id=>P[id]=nextTag(BY[id].g));render();toast(`${ids.length}명을 참여 인원으로 확정했어요`)};
ACT.pRm=b=>{const id=b.dataset.id,m=BY[id];const ss=sessionsOf(U.eid);const n=ss.filter(s=>S.att[s.id]&&S.att[s.id][id]).length;
  const go=()=>{delete partsOf(U.eid)[id];ss.forEach(s=>{if(S.groups[s.id])delete S.groups[s.id].assign[id]});render();toast(`${esc(m.name)}님을 참여 인원에서 뺐어요`)};
  if(!n)return go();
  openSheet(`<h3>${esc(m.name)}님을 뺄까요?</h3><div class="notice"><p>이미 ${n}번 출석한 기록이 있어요.</p><span class="hint">빼면 조 편성에서도 빠집니다. 출석 기록은 남지만 이 행사 명단에는 보이지 않아요.</span></div>
    <div class="actions"><button class="btn ghost" type="button" id="c">취소</button><button class="btn danger" type="button" id="o">빼기</button></div>`);
  $("c").onclick=closeSheet;$("o").onclick=()=>{closeSheet();go()}};

/* ---------- ③ 조 편성 ---------- */
const HINT={all:"남녀 모두 새로 섞습니다. 조마다 남녀 인원이 고르게 들어갑니다.",fixM:"남자는 지금 조에 그대로 두고 여자만 다시 섞습니다. 비어 있으면 ‘이전 회차 불러오기’로 시작하세요.",fixF:"여자는 지금 조에 그대로 두고 남자만 다시 섞습니다. 비어 있으면 ‘이전 회차 불러오기’로 시작하세요."};
function grState(){return S.groups[U.sid]||(S.groups[U.sid]={k:Math.max(2,Math.min(8,Math.round(partIds(U.eid).length/10)||4)),assign:{}})}
function tGroups(){
  const n=needs();if(n){$("tabBody").innerHTML=n;return}
  const s=sessById(U.sid),prev=sessionsOf(U.eid).filter(x=>x.no<s.no&&S.groups[x.id]);
  $("tabBody").innerHTML=`${sessBar()}
  <section class="settings"><div class="set"><span class="lbl">조 개수</span><div class="stepper"><button type="button" data-act="kMinus" aria-label="조 줄이기">−</button><output class="num" id="kOut"></output><button type="button" data-act="kPlus" aria-label="조 늘리기">+</button></div></div>
    <div class="set"><span class="lbl">랜덤 방식</span><div class="seg">${[["all","남녀 모두 랜덤"],["fixM","남자 고정 · 여자만 랜덤"],["fixF","여자 고정 · 남자만 랜덤"]].map(([v,l])=>`<button type="button" data-act="grMode" data-m="${v}" aria-pressed="${U.grMode===v}">${l}</button>`).join("")}</div></div>
    <div class="set"><span class="lbl">겹침 방지</span><label class="chk"><input type="checkbox" id="avoid" checked> 이전 회차에 같은 조였던 이성 피하기</label></div>
    <div class="go">${prev.length?`<button class="btn ghost" type="button" data-act="grLoad" data-sid="${prev[prev.length-1].id}">${prev[prev.length-1].no}회차 편성 불러오기</button>`:""}<button class="btn ghost" type="button" data-act="grClear">모두 비우기</button><button class="btn big" type="button" data-act="grRand">랜덤 배정</button></div>

      <div class="carbox">${m.cars.length?`<div class="hd"><span class="ttl">등록 차량</span></div>${m.cars.map(p=>`<button class="toggle" type="button" data-pl="${esc(p)}" aria-pressed="${!!(c&&c.plate===p)}"><span class="plate">${esc(p)}</span> ${c&&c.plate===p?"✓ 도착 "+hm(c.at)+" · 눌러서 취소":"도착 체크"}</button>`).join("")}`
        :`<div class="hd"><span class="ttl">등록된 차량 없음 · 오늘 가져온 차량 입력</span></div>${plateFields(false)}<p class="errmsg" id="pErr" hidden></p><button class="btn" type="button" id="pSave">차량 등록하고 도착 체크</button>`}</div>
      ${confirming?`<div class="notice err"><p>${esc(m.name)}님의 ${sessById(U.sid).no}회차 출석을 취소할까요?</p><div class="actions"><button class="btn ghost" type="button" id="no">아니요</button><button class="btn danger" type="button" id="yes">출석 취소</button></div></div>`
        :`<div class="actions"><button class="btn danger l" type="button" id="cx">출석 취소</button><button class="btn" type="button" id="cl">닫기</button></div>`}`);
    $("sheet").querySelectorAll("[data-pl]").forEach(x=>x.onclick=()=>{const p=x.dataset.pl;if(CR()[id]&&CR()[id].plate===p){carOut(id);toast(`${esc(p)} 도착 취소`)}else{carIn(id,p);toast(`<strong>${esc(p)}</strong> 도착 · ${esc(m.name)}`)}rCheck();draw(confirming)});
    if($("pSave")){const sv=()=>{const r=readPlate(true,id);if(r.error){$("pErr").textContent=r.error;$("pErr").hidden=false;return}m.cars.push(r.plate);carIn(id,r.plate);rCheck();toast(`<strong>${esc(r.plate)}</strong> 등록 · 도착 체크`);draw(confirming)};bindPlate(sv);$("pSave").onclick=sv}
    if(confirming){$("no").onclick=()=>draw(false);$("yes").onclick=()=>{delete A()[id];LG().unshift({t:Date.now(),mid:id,kind:"out",dev:U.dev});closeSheet();rCheck();refreshSteps();toast(`${esc(m.name)} 출석을 취소했어요`)}}
    else{$("cx").onclick=()=>draw(true);$("cl").onclick=closeSheet}};
  draw(false);
}
ACT.walkIn=()=>{
  const pre=($("cq")?.value||"").trim().replace(/[ㄱ-ㅎ]/g,"");let g=U.ckG==="F"?"F":"M";
  openSheet(`<h3>현장 등록</h3><p class="hint" style="margin:0">회원 명부에 등록하고, 이 행사 참여 인원에 넣고, ${sessById(U.sid).no}회차 출석까지 한 번에 처리합니다.</p>
    <div class="field"><label for="wName">이름 <b>*</b></label><input id="wName" value="${esc(pre)}" autocomplete="off"></div>
    <div class="field"><span class="lbl">성별 <b>*</b></span><div class="gender"><button type="button" class="M" data-wg="M" aria-pressed="${g==="M"}">형제(남)</button><button type="button" class="F" data-wg="F" aria-pressed="${g==="F"}">자매(여)</button></div></div>
    <div class="field"><label for="wPhone">휴대폰 (선택)</label><input id="wPhone" inputmode="tel" placeholder="010-1234-5678"></div>
    <div class="field"><span class="lbl">오늘 가져온 차량번호 (선택) · 입력하면 도착 체크까지 됩니다</span>${plateFields(false)}</div>
    <p class="errmsg" id="wErr" hidden></p>
    <div class="actions"><button class="btn ghost" type="button" id="c">취소</button><button class="btn" type="button" id="o">등록하고 출석</button></div>`);
  $("sheet").querySelectorAll("[data-wg]").forEach(b=>b.onclick=()=>{g=b.dataset.wg;$("sheet").querySelectorAll("[data-wg]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  bindPlate();$("c").onclick=closeSheet;setTimeout(()=>$("wName").focus(),30);
  $("o").onclick=()=>{const name=$("wName").value.trim(),pr=$("wPhone").value.trim(),err=$("wErr");
    if(!name){err.textContent="이름을 입력하세요.";err.hidden=false;return}
    const ph=pr?normPhone(pr):"";if(pr&&!ph){err.textContent="휴대폰은 010으로 시작하는 11자리로 입력하세요. 비워 둬도 됩니다.";err.hidden=false;return}
    const ex=ph&&S.members.find(m=>m.phone===ph);if(ex){err.innerHTML=`이미 회원인 ${esc(ex.name)}님의 번호예요. 참여 인원에 없다면 2단계에서 추가하세요.`;err.hidden=false;return}
    const r=readPlate(false);if(r.error){err.textContent=r.error;err.hidden=false;return}
    const m={id:uid("m"),name,g,phone:ph,church:"",cars:r.plate?[r.plate]:[],memo:"현장 등록",created:Date.now()};S.members.push(m);reindex();
    partsOf(U.eid)[m.id]=nextTag(g);closeSheet();if($("cq"))$("cq").value="";if(r.plate)carIn(m.id,r.plate);checkIn(m.id)};
};

/* ================= 통계 ================= */
Object.assign(U,{stScope:"event",stEid:null,stG:"ALL",stSort:"name",stQ:""});
const pctS=x=>x==null?"-":Math.round(x*100)+"%";
const meter=x=>x==null?'<span class="muted">-</span>':`<span class="rate"><span class="bar"><i style="width:${x*100}%"></i></span><span class="num">${pctS(x)}</span></span>`;
function vStats(){
  const evs=[...S.events].sort((a,b)=>b.no-a.no);
  if(!U.stEid||!evById(U.stEid))U.stEid=(evs.find(e=>sessionsOf(e.id).some(s=>s.date<=TODAY))||evs[0]||{}).id||null;
  $("view").innerHTML=`<div class="pagehead"><div><h1>통계</h1><span class="sub">행사별 회차 출석과 회원별 참여 행사·출석률을 봅니다. 출석률은 지난 회차와 오늘 회차만 계산해요.</span></div></div>
  <div class="controls"><div class="seg">${[["event","행사별"],["all","회원 누적"]].map(([v,l])=>`<button type="button" data-act="stScope" data-v="${v}" aria-pressed="${U.stScope===v}">${l}</button>`).join("")}</div>
    ${U.stScope==="event"&&evs.length?`<select class="sel" id="stEv" aria-label="행사">${evs.map(e=>`<option value="${e.id}" ${e.id===U.stEid?"selected":""}>제${e.no}회 ${esc(e.name)}</option>`).join("")}</select>`:""}</div>
  <div id="stBody" style="display:flex;flex-direction:column;gap:14px"></div>`;
  U.stScope==="event"?stEvent():stAll();
}
function stFilters(sorts){return `<div class="controls"><div class="seg">${["ALL","M","F"].map(g=>`<button type="button" data-act="stG" data-g="${g}" aria-pressed="${U.stG===g}">${g==="ALL"?"전체":g==="M"?"남":"여"}</button>`).join("")}</div>
  <label class="search" for="stq"><input id="stq" type="search" autocomplete="off" placeholder="이름·초성 검색" value="${esc(U.stQ)}"><button class="clear" type="button" data-act="clr" data-for="stq" aria-label="지우기">×</button></label>
  <div class="seg">${sorts.map(([v,l])=>`<button type="button" data-act="stSort" data-v="${v}" aria-pressed="${U.stSort===v}">${l}</button>`).join("")}</div></div>`}
function stRows(ids){const q=U.stQ.replace(/\s+/g,"");return ids.map(id=>({m:BY[id],h:q?matchAt(BY[id].name,q):-1})).filter(x=>(U.stG==="ALL"||x.m.g===U.stG)&&(!q||x.h>=0))}
function stEvent(){
  const eid=U.stEid;if(!eid){$("stBody").innerHTML=`<div class="empty"><strong>행사가 없어요</strong></div>`;return}
  const ss=sessionsOf(eid),held=ss.filter(s=>s.date<=TODAY),ids=partIds(eid),P=partsOf(eid);
  const att=(s,id)=>!!(S.att[s.id]&&S.att[s.id][id]);
  const tot=held.length*ids.length,got=held.reduce((n,s)=>n+ids.filter(id=>att(s,id)).length,0);
  const carAvg=held.length?held.reduce((n,s)=>n+Object.keys(S.cars[s.id]||{}).filter(id=>P[id]!=null).length,0)/held.length:null;
  const mN=ids.filter(id=>BY[id].g==="M").length;
  const rateG=g=>{const L=ids.filter(id=>BY[id].g===g);const t=held.length*L.length;return t?held.reduce((n,s)=>n+L.filter(id=>att(s,id)).length,0)/t:null};
  $("stBody").innerHTML=`<section class="summary">
    <div class="stat"><div class="row"><span class="lbl">진행한 회차</span><span class="val num">${held.length}<small>/${ss.length}</small></span></div></div>
    <div class="stat"><div class="row"><span class="lbl">평균 출석률</span><span class="val num">${pctS(tot?got/tot:null)}</span></div><div class="bar"><i style="width:${tot?got/tot*100:0}%"></i></div></div>
    <div class="stat M"><div class="row"><span class="lbl">형제 ${mN}명</span><span class="val num">${pctS(rateG("M"))}</span></div><div class="bar"><i style="width:${(rateG("M")||0)*100}%"></i></div></div>
    <div class="stat F"><div class="row"><span class="lbl">자매 ${ids.length-mN}명</span><span class="val num">${pctS(rateG("F"))}</span></div><div class="bar"><i style="width:${(rateG("F")||0)*100}%"></i></div></div>
    <div class="stat"><div class="row"><span class="lbl">회차당 차량</span><span class="val num">${carAvg==null?"-":carAvg.toFixed(1)}<small>대</small></span></div></div></section>
  <h2 class="hint" style="margin:4px 0 0;font-weight:700;letter-spacing:.04em">회차별 출석</h2>
  <div class="tablewrap"><table style="min-width:640px"><thead><tr><th>회차</th><th>날짜</th><th>형제</th><th>자매</th><th>전체 출석률</th><th>차량 도착</th></tr></thead><tbody>
  ${ss.length?ss.map(s=>{if(s.date>TODAY)return `<tr><td><strong>${s.no}회차</strong></td><td>${fmtS(s.date)}</td><td colspan="4" class="muted">예정</td></tr>`;
    const c=g=>{const L=ids.filter(id=>BY[id].g===g);return `<span class="num">${L.filter(id=>att(s,id)).length}/${L.length}</span>`};const n=ids.filter(id=>att(s,id)).length;
    return `<tr><td><strong>${s.no}회차</strong></td><td>${fmtS(s.date)}${s.date===TODAY?' <span class="pill ok">오늘</span>':""}</td><td>${c("M")}</td><td>${c("F")}</td><td>${meter(ids.length?n/ids.length:null)}</td><td class="num">${Object.keys(S.cars[s.id]||{}).filter(id=>P[id]!=null).length}대</td></tr>`}).join("")
    :'<tr><td colspan="6" class="muted">회차가 없어요.</td></tr>'}</tbody></table></div>
  <h2 class="hint" style="margin:4px 0 0;font-weight:700;letter-spacing:.04em">참여자별 출석</h2>
  ${stFilters([["name","이름순"],["low","출석률 낮은 순"]])}
  <div class="tablewrap"><table style="min-width:600px"><thead><tr><th>이름</th><th>명찰</th><th>${ss.map(s=>`<span class="mk f" title="${fmtS(s.date)}" style="margin-right:4px">${s.no}</span>`).join("")}</th><th>출석</th><th>출석률</th></tr></thead><tbody id="stTb"></tbody></table></div>
  <p class="hint" style="margin:0"><span class="mk y">✓</span> 출석 · <span class="mk n">✕</span> 결석 · <span class="mk f">·</span> 예정 회차</p>`;
  rStEvent();
}
function rStEvent(){
  const eid=U.stEid,ss=sessionsOf(eid),held=ss.filter(s=>s.date<=TODAY),P=partsOf(eid),q=U.stQ.replace(/\s+/g,"");
  const rows=stRows(partIds(eid)).map(r=>{const a=held.filter(s=>S.att[s.id]&&S.att[s.id][r.m.id]).length;return{...r,a,rate:held.length?a/held.length:null}});
  rows.sort((x,y)=>U.stSort==="low"?((x.rate??2)-(y.rate??2))||x.m.name.localeCompare(y.m.name,"ko"):(x.m.g===y.m.g?x.m.name.localeCompare(y.m.name,"ko"):x.m.g==="M"?-1:1));
  $("stTb").innerHTML=rows.length?rows.map(({m,h,a,rate})=>`<tr><td><span class="dot ${m.g}"></span><span class="nm">${hl(m.name,h,q.length)}</span></td><td class="num muted">${P[m.id]}</td>
    <td><span class="marks">${ss.map(s=>s.date>TODAY?'<span class="mk f">·</span>':S.att[s.id]&&S.att[s.id][m.id]?'<span class="mk y">✓</span>':'<span class="mk n">✕</span>').join("")}</span></td>
    <td class="num">${a}/${held.length}</td><td>${meter(rate)}</td></tr>`).join(""):'<tr><td colspan="5" class="muted">해당하는 참여자가 없어요.</td></tr>';
}
function stAll(){
  $("stBody").innerHTML=`<p class="hint" style="margin:0">모든 행사를 합친 회원별 참여 이력과 누적 출석률입니다.</p>
  ${stFilters([["name","이름순"],["many","참여 많은 순"],["low","출석률 낮은 순"]])}
  <div class="tablewrap"><table style="min-width:720px"><thead><tr><th>이름</th><th>성별</th><th>참여 행사와 회차별 출석</th><th>누적 출석</th><th>출석률</th></tr></thead><tbody id="stTb"></tbody></table></div>`;
  rStAll();
}
function rStAll(){
  const q=U.stQ.replace(/\s+/g,"");
  const rows=stRows(S.members.map(m=>m.id)).map(r=>{const hs=memberHist(r.m.id);let t=0,a=0;hs.forEach(x=>{t+=x.marks.length;a+=x.marks.filter(Boolean).length});return{...r,hs,t,a,rate:t?a/t:null}});
  const nm=(x,y)=>x.m.name.localeCompare(y.m.name,"ko");
  rows.sort((x,y)=>U.stSort==="many"?(y.hs.length-x.hs.length)||nm(x,y):U.stSort==="low"?((x.rate??2)-(y.rate??2))||nm(x,y):nm(x,y));
  $("stTb").innerHTML=rows.length?rows.map(({m,h,hs,t,a,rate})=>`<tr><td><span class="dot ${m.g}"></span><span class="nm">${hl(m.name,h,q.length)}</span></td><td><span class="pill ${m.g}">${GN(m.g)}</span></td>
    <td style="white-space:normal">${hs.length?`<div style="display:flex;flex-direction:column;gap:4px">${hs.map(x=>`<span style="display:flex;gap:8px;align-items:center"><span class="pill ac" style="min-width:52px;text-align:center">제${x.e.no}회</span><span class="marks">${x.marks.map(v=>`<span class="mk ${v?"y":"n"}">${v?"✓":"✕"}</span>`).join("")||'<span class="hint">진행 전</span>'}</span></span>`).join("")}</div>`:'<span class="muted">참여 없음</span>'}</td>
    <td class="num">${t?a+"/"+t:"-"}</td><td>${meter(rate)}</td></tr>`).join(""):'<tr><td colspan="5" class="muted">해당하는 회원이 없어요.</td></tr>';
}
const rSt=()=>U.stScope==="event"?rStEvent():rStAll();
INP.stEv=t=>{U.stEid=t.value;vStats()};
INP.stq=t=>{U.stQ=t.value;rSt()};
ACT.stScope=b=>{U.stScope=b.dataset.v;if(U.stScope==="event"&&U.stSort==="many")U.stSort="name";vStats()};
ACT.stG=b=>{U.stG=b.dataset.g;document.querySelectorAll('[data-act="stG"]').forEach(x=>x.setAttribute("aria-pressed",x===b));rSt()};
ACT.stSort=b=>{U.stSort=b.dataset.v;document.querySelectorAll('[data-act="stSort"]').forEach(x=>x.setAttribute("aria-pressed",x===b));rSt()};

render();
})();
</script>

</body>
</html>
